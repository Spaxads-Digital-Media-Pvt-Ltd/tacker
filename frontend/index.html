<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker</title>
    <meta name="description" content="Tracker — affiliate tracking platform" />
    <meta name="color-scheme" content="light dark" />
    <!-- No-flash theme: same logic as readStoredTheme() in src/theme/ThemeContext.tsx (keep in sync).
         Explicit stored choice wins; otherwise follow prefers-color-scheme. -->
    <script>
      (function () {
        var t = null;
        try {
          var v = localStorage.getItem('tracker-theme');
          if (v === 'dark' || v === 'light') t = v;
        } catch (e) {}
        if (!t) {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        document.documentElement.classList.toggle('dark', t === 'dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
