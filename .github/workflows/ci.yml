name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --- HARD REQUIREMENT (spec §3A): no secret pattern may appear in the frontend repo. ---
  secret-scan-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a secret pattern appears in frontend/
        run: |
          echo "Scanning frontend/ for forbidden secret patterns..."
          # service_role keys, generic private keys, and any *_SERVICE_ROLE / JWT secret names.
          # VITE_SUPABASE_ANON_KEY is allowed (anon key, login flow only).
          if grep -REn \
            -e 'service_role' \
            -e 'SUPABASE_SERVICE_ROLE' \
            -e 'JWT_SECRET' \
            -e 'ANTHROPIC_API_KEY' \
            -e 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY' \
            --include='*.ts' --include='*.tsx' --include='*.js' \
            --include='*.jsx' --include='*.json' --include='*.env*' \
            --exclude-dir=node_modules --exclude-dir=dist \
            frontend/ ; then
              echo "::error::Forbidden secret pattern found in frontend/. Secrets are backend-only (spec §3A)."
              exit 1
          fi
          echo "OK — no forbidden secret patterns in frontend/."

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker_ci
          POSTGRES_DB: tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tracker:tracker_ci@localhost:5432/tracker_test
      REDIS_URL: redis://localhost:6379
      SUPABASE_JWT_SECRET: ci-test-jwt-secret
      INTEGRATION_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run migrate
      # Cross-tenant AND cross-owner isolation suite — LIVE against Postgres (spec §3A).
      - run: npm run test:isolation
      - run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
